        - contentHash
        - originRef
        - label
        - bucket
        - metadata
        - status
        - attempts
        - lastError
        - affectedPageIds
        - originalBytes
        - createdAt
        - compiledAt
        - deletedAt
      properties:
        id:
          type: string
          description: "Prefixed source id, `src_...`."
        brainId:
          type: string
        kind:
          $ref: "#/components/schemas/CaptureKind"
        contentPreview:
          type: string
        contentUrl:
