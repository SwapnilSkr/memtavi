        from:
          type: string
        to:
          type: string

    PageVersionHunk:
      type: object
      required:
        - oldStart
        - oldLines
        - newStart
        - newLines
        - lines
      properties:
        oldStart:
          type: integer
          minimum: 0
        oldLines:
          type: integer
          minimum: 0
        newStart:
          type: integer
          minimum: 0
        newLines:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PageVersionDiffLine"

    PageVersionDiffLine:
      type: object
      required:
