        - createdAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        image:
          type:
            - string
            - "null"
          format: uri
        role:
          $ref: "#/components/schemas/MemberRole"
        createdAt:
          type: string
          format: date-time

    Webhook:
      type: object
      required:
        - id
        - subjectId
        - url
        - events
        - active
      properties:
        id:
          type: string
          format: uuid
        subjectId:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        active:
          type: boolean
        secret:
          type: string
          description: >-
            The plaintext signing secret. Returned only by the create response and never shown
            again; list and delete responses omit it.

    WebhookCreate:
      type: object
      required:
        - url
        - events
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            An `http` or `https` URL with no embedded credentials, at most 2,048 characters.
        events:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          description: One to twenty distinct change actions.
          items:
            type: string
            enum:
              - created
              - updated
              - renamed
              - merged
              - split
              - archived
              - restored
              - recovered
              - routed

