        - entities
        - backlinks
        - contentHash
        - embeddingModel
        - lastCompiledAt
        - lastReferencedAt
        - userEditedAt
        - deletionState
      properties:
        id:
          type: string
          description: "Prefixed page id, `pg_...`."
        subjectId:
          type: string
          format: uuid
        brainId:
          type: string
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        pageType:
          $ref: "#/components/schemas/PageType"
        bucket:
          $ref: "#/components/schemas/Bucket"
        bucketSource:
          $ref: "#/components/schemas/BucketSource"
        status:
          $ref: "#/components/schemas/PageStatus"
        pinned:
          type: boolean
        archived:
          type: boolean
        version:
          type: integer
          minimum: 1
        entities:
          type: array
          items:
            type: string
        backlinks:
          type: array
          items:
            type: string
        contentHash:
          type: string
        embeddingModel:
          type:
            - string
            - "null"
        lastCompiledAt:
          type:
            - string
            - "null"
          format: date-time
        lastReferencedAt:
          type:
            - string
            - "null"
          format: date-time
        userEditedAt:
          type:
            - string
            - "null"
          format: date-time
        deletionState:
          $ref: "#/components/schemas/DeletionState"

    PageUpdate:
      type: object
      properties:
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        bucket:
          $ref: "#/components/schemas/Bucket"
        pinned:
          type: boolean
        archived:
          type: boolean
        status:
          $ref: "#/components/schemas/PageStatus"
        version:
          type: integer
          minimum: 1
          description: The version the client last read. A mismatch returns `409`.

    PageVersionSummary:
      type: object
      description: One immutable page version without its body.
      required:
        - version
        - title
        - summary
        - actor
        - ingestSourceId
        - createdAt
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        actor:
          $ref: "#/components/schemas/ChangeActor"
        ingestSourceId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    PageVersion:
      type: object
      description: One immutable page version, including its body.
      required:
        - version
        - title
        - summary
        - body
        - actor
        - ingestSourceId
        - createdAt
      properties:
        version:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        actor:
          $ref: "#/components/schemas/ChangeActor"
        ingestSourceId:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time

    ExportedPageVersion:
      type: object
      description: A page version as returned by the brain export.
      required:
        - id
        - pageId
        - version
        - title
        - summary
        - body
        - actor
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        pageId:
          type: string
        version:
          type: integer
          minimum: 1
        title:
          type: string
        summary:
          type: string
        body:
          type: string
        ingestSourceId:
          type:
            - string
            - "null"
        actor:
          $ref: "#/components/schemas/ChangeActor"
        createdAt:
          type: string
          format: date-time

    PageVersionDiff:
      type: object
      description: A line-based unified diff between two page versions.
      required:
        - from
        - to
        - title
        - summary
        - hunks
      properties:
        from:
          type: integer
          minimum: 1
        to:
          type: integer
          minimum: 1
        title:
          $ref: "#/components/schemas/PageVersionField"
        summary:
          $ref: "#/components/schemas/PageVersionField"
        hunks:
          type: array
          items:
            $ref: "#/components/schemas/PageVersionHunk"

    PageVersionField:
      type: object
      required:
        - from
        - to
