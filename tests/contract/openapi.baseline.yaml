components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Tenant-scoped API key carrying a role.
    subjectId:
      type: apiKey
      in: header
      name: x-subject-id
      description: End-user UUID. Determines which brains are visible.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    SearchLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of search hits to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IndexLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of index entries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 40
    Offset:
      name: offset
      in: query
      required: false
      description: Number of items to skip before collecting the page.
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Client-generated key. A replay within 24 hours returns the original response
        byte-for-byte.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    Permanent:
      name: permanent
      in: query
      required: true
      description: Confirmation that the page is deleted permanently. Must be `true`.
      schema:
        type: boolean
        const: true
    BrainId:
      name: brainId
      in: path
      required: true
      description: "Prefixed brain id, `brn_` followed by 32 lowercase hex characters."
      schema:
        type: string
        pattern: "^brn_[0-9a-f]{32}$"
    SourceId:
      name: sourceId
      in: path
      required: true
      description: "Prefixed ingest source id, `src_` followed by 32 lowercase hex characters."
      schema:
        type: string
        pattern: "^src_[0-9a-f]{32}$"
    ConnectionId:
      name: connectionId
      in: path
      required: true
      description: "Prefixed connection id, `cnn_` followed by 32 lowercase hex characters."
      schema:
        type: string
        pattern: "^cnn_[0-9a-f]{32}$"
    ChangeId:
      name: changeId
      in: path
      required: true
      description: "Prefixed change event id, `chg_` followed by 32 lowercase hex characters."
      schema:
        type: string
        pattern: "^chg_[0-9a-f]{32}$"
    Slug:
      name: slug
      in: path
      required: true
      description: The page slug within the brain.
      schema:
        type: string
        minLength: 1
    Version:
      name: version
      in: path
      required: true
      description: The page version number.
      schema:
        type: integer
        minimum: 1
    WebhookId:
      name: webhookId
      in: path
      required: true
      description: Webhook UUID.
      schema:
        type: string
        format: uuid
    KeyId:
      name: keyId
      in: path
      required: true
      description: API key UUID.
      schema:
        type: string
        format: uuid

  headers:
    RequestId:
      description: Correlation identifier for the request.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0

  responses:
    Error400:
      description: Malformed body, a wrong enum, both `content` and `fetchUrl`, or a malformed subject id.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error401:
      description: Missing, unknown, expired or revoked API key.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error403:
      description: The key role does not permit this operation or granting a higher role.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error404:
      description: Not found, or owned by another tenant. Cross-tenant access is 404, never 403.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error409:
      description: Conflict with the current state, such as a page version conflict or a duplicate slug.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error422:
      description: The request is well formed but semantically invalid.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error429:
      description: Rate limited. Retry after the number of seconds in `Retry-After`.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Error500:
      description: Unexpected server error. Never used for a provider's error.
      headers:
        x-request-id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    ErrorEnvelope:
      type: object
      description: The one error shape used by every error response.
      required:
        - statusCode
        - timestamp
        - path
        - message
        - body
      example:
        statusCode: 404
        timestamp: "2026-11-06T10:00:00.000Z"
        path: /v1/brains/brn_1
        message: Not found
        body:
          message: Not found
          error: NotFoundError
          statusCode: 404
      properties:
        statusCode:
          type: integer
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        message:
          type: string
        body:
          type: object
          required:
            - message
            - error
            - statusCode
          properties:
            message:
              type: string
            error:
              type: string
            statusCode:
              type: integer

    PageType:
      type: string
      enum:
        - source
        - topic
        - entity
        - project
        - decision
        - brief

    Bucket:
      type: string
      enum:
        - inbox
        - notes
        - ideas
        - projects

    BucketSource:
      type: string
      enum:
        - auto
        - user

    PageStatus:
      type: string
      enum:
        - active
        - stale
        - contested
        - deprecated
        - archived

    DeletionState:
      type: string
      enum:
        - active
        - deleting
        - deleted

    SourceStatus:
      type: string
      enum:
        - pending
        - compiling
        - completed
        - failed

    CaptureKind:
      type: string
      enum:
        - note
        - url
        - file
        - transcript
        - chat_turn
        - integration

    ConnectionStrength:
      type: string
      enum:
        - weak
        - medium
        - strong

    ConnectionSource:
      type: string
      enum:
        - auto
        - manual

    ChangeAction:
      type: string
      enum:
        - created
        - updated
        - renamed
        - merged
        - split
        - archived
        - restored
        - recovered
        - routed

    ChangeActor:
      type: string
      enum:
        - compiler
        - user

    MemberRole:
      type: string
      enum:
        - owner
        - admin
        - developer
        - viewer

    TargetType:
      type: string
      enum:
        - brain
        - source
        - page

    Brain:
      type: object
      description: A subject's memory store.
      required:
        - id
        - subjectId
        - projectId
        - name
        - slug
        - description
        - briefSettings
        - deletionState
        - createdAt
