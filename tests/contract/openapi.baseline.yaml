openapi: 3.1.0

info:
  title: Memtavi API
  version: 1.0.0
  description: |
    Memtavi turns captured material into a compiled, linked memory for one subject.

    Every path in this document is prefixed with `/v1`, so `servers` names the host root
    rather than an API version root. Requests authenticate with two headers, `x-api-key`
    (tenant-scoped and role-bearing) and `x-subject-id` (the end-user UUID that determines
    which brains are visible).

    A resource owned by another tenant is reported as `404`, never `403`, so the API never
    reveals that the resource exists.
  contact:
    name: Memtavi
    url: https://api.memtavi.com

servers:
  - url: https://api.memtavi.com

security:
  - apiKey: []
    subjectId: []

tags:
  - name: Brains
    description: Memory stores, one per subject or project.
  - name: Captures
    description: Raw material submitted for compilation.
  - name: Sources
    description: Ingest sources and their compilation status.
  - name: Pages
    description: Compiled knowledge pages.
  - name: Search
    description: Search, index and graph reads over a brain.
  - name: Connections
    description: Semantic links between pages.
  - name: Changes
    description: The change feed for a brain.
  - name: Score
    description: Brain health metrics.
  - name: Profile
    description: The subject profile that steers compilation.
  - name: Export
    description: Whole-brain export.
  - name: Webhooks
    description: Event delivery registrations.
  - name: Tenant
    description: The caller's tenant.
  - name: Members
    description: People with access to the tenant.
  - name: API Keys
    description: Tenant-scoped credentials.

paths:
  /v1/brains:
    get:
      operationId: listBrains
      tags:
        - Brains
      summary: List brains
      description: Lists the brains visible to the subject in `x-subject-id`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Brains visible to the subject.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Brain"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    post:
      operationId: createBrain
      tags:
        - Brains
      summary: Create a brain
      description: Creates a brain for the subject in `x-subject-id`. Requires developer or higher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainCreate"
      responses:
        "201":
          description: The brain was created.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brain"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: getBrain
      tags:
        - Brains
      summary: Get a brain
      responses:
        "200":
          description: The brain.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brain"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    patch:
      operationId: updateBrain
      tags:
        - Brains
      summary: Update a brain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrainUpdate"
      responses:
        "200":
          description: The updated brain.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brain"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    delete:
      operationId: deleteBrain
      tags:
        - Brains
      summary: Delete a brain
      description: Accepts an asynchronous deletion of the brain and everything under it.
      responses:
        "202":
          description: Deletion accepted for asynchronous processing.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/captures:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    post:
      operationId: createCapture
      tags:
        - Captures
      summary: Capture material
      description: |
        Submits one capture for compilation. Supply exactly one of `content` or `fetchUrl`;
        supplying both returns `400`. The capture is queued, not compiled in the request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Capture"
      responses:
        "200":
          description: A source with the same `originRef` already exists and is returned.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSource"
        "201":
          description: The capture was accepted and queued.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSource"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/sources:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: listIngestSources
      tags:
        - Sources
      summary: List ingest sources
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Ingest sources for the brain.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IngestSource"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/sources/{sourceId}:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getIngestSource
      tags:
        - Sources
      summary: Get an ingest source
      responses:
        "200":
          description: The ingest source.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSource"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    delete:
      operationId: deleteIngestSource
      tags:
        - Sources
      summary: Delete an ingest source
      description: Deletes the source. Pages derived from it stay in place.
      responses:
        "202":
          description: Deletion accepted for asynchronous processing.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/sources/{sourceId}/content:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/SourceId"
    get:
      operationId: getSourceContent
      tags:
        - Sources
      summary: Get a short-lived URL for a source body
      description: |
        Returns a signed URL that expires after 300 seconds. `url` and `expiresAt` are
        `null` when the configured object store cannot sign. A source without a stored
        body returns `404`.
      responses:
        "200":
          description: A short-lived URL for the stored source body.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceContentUrl"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/sources/{sourceId}/retry:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/SourceId"
    post:
      operationId: retryIngestSource
      tags:
        - Sources
      summary: Retry a failed ingest source
      description: |
        Queues another attempt for a source whose status is `failed`, keeping the same source id.
        The status returns to `pending` and `lastError` is cleared. `attempts` counts accepted
        retries and is never reset. When the stored body or chunks exist the source is recompiled;
        otherwise the original fetch is repeated. Storage usage is not counted again. Requires
        developer or higher.
      responses:
        "202":
          description: The source was requeued with status `pending`.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestSource"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/pages:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: listPages
      tags:
        - Pages
      summary: List pages
      description: Lists pages without bumping `lastReferencedAt`.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Pages in the brain.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Page"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/pages/{slug}:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getPage
      tags:
        - Pages
      summary: Get a page by slug
      description: |
        Reads the page and bumps `lastReferencedAt`. It is a consumption signal, not a
        list hydrator, so list endpoints do not bump it.
      responses:
        "200":
          description: The page.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    patch:
      operationId: updatePage
      tags:
        - Pages
      summary: Update a page
      description: |
        Applies a user edit and records a new page version. Sending a `version` that is not
        the current version returns `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdate"
      responses:
        "200":
          description: The updated page.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"
    delete:
      operationId: deletePage
      tags:
        - Pages
      summary: Delete a page permanently
      description: |
        Permanently deletes the page. `permanent=true` is a required confirmation, not a
        soft-delete flag.
      parameters:
        - $ref: "#/components/parameters/Permanent"
      responses:
        "202":
          description: Deletion accepted for asynchronous processing.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionReceipt"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/pages/{slug}/versions:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: listPageVersions
      tags:
        - Pages
      summary: List page versions
      description: |
        Lists the immutable version history of a page, newest first, without bodies.
        Reading versions does not bump `lastReferencedAt`; only `getPage` does.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Page versions, newest first.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PageVersionSummary"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
              example:
                items:
                  - version: 3
                    title: Compiler prompt
                    summary: How the compiler chooses a band
                    actor: compiler
                    ingestSourceId: null
                    createdAt: "2026-11-10T10:00:00.000Z"
                total: 1
                limit: 50
                offset: 0
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/pages/{slug}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/Slug"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getPageVersion
      tags:
        - Pages
      summary: Get a page version
      description: |
        Returns one immutable page version, including its body. Reading a version does not
        bump `lastReferencedAt`.
      responses:
        "200":
          description: The page version.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVersion"
              example:
                version: 2
                title: Compiler prompt
                summary: How the compiler chooses a band
                body: "Bands are chosen by the policy threshold.\n"
                actor: compiler
                ingestSourceId: src_0123456789abcdef0123456789abcdef
                createdAt: "2026-11-10T10:00:00.000Z"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/pages/{slug}/diff:
    parameters:
      - $ref: "#/components/parameters/BrainId"
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: diffPageVersions
      tags:
        - Pages
      summary: Diff two page versions
      description: |
        Line-based unified diff of `body` between two versions, with three lines of context.
        `from` is required and `to` defaults to the page's current version. A missing or
        malformed `from`, or a `from` that is greater than or equal to `to`, answers `400`.
        A page or version that does not exist answers `404`. Bodies larger than 5,000 lines on
        either side answer `400` rather than doing unbounded diff work. Reading versions does
        not bump `lastReferencedAt`.
      parameters:
        - name: from
          in: query
          required: true
          description: The older version.
          schema:
            type: integer
            minimum: 1
        - name: to
          in: query
          required: false
          description: The newer version. Defaults to the page's current version.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The diff between the two versions.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageVersionDiff"
              example:
                from: 1
                to: 2
                title:
                  from: Compiler prompt
                  to: Compiler prompt
                summary:
                  from: How the compiler chooses a band
                  to: How the compiler chooses a band and a route
                hunks:
                  - oldStart: 1
                    oldLines: 2
                    newStart: 1
                    newLines: 2
                    lines:
                      - op: context
                        text: Bands are chosen by the policy threshold.
                      - op: remove
                        text: Routing is out of scope.
                      - op: add
                        text: Routing follows the band.
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/search:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: searchBrain
      tags:
        - Search
      summary: Search a brain
      description: |
        Keyword matches bypass `minSimilarity`; semantic-only matches do not. `similarity`
        carries the vector score only, so results can appear out of similarity order.
      parameters:
        - name: q
          in: query
          required: true
          description: The search phrase.
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/SearchLimit"
        - name: minSimilarity
          in: query
          required: false
          description: Lowest vector similarity to return for semantic-only matches.
          schema:
            type: number
            minimum: 0
            maximum: 1
      responses:
        "200":
          description: Ranked search hits.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/index:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: getIndex
      tags:
        - Search
      summary: Get the brain index
      description: Returns the compact index of pages in the brain.
      parameters:
        - $ref: "#/components/parameters/IndexLimit"
      responses:
        "200":
          description: Index entries for the brain.
          headers:
            x-request-id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - total
                  - limit
                  - offset
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/IndexEntry"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "429":
          $ref: "#/components/responses/Error429"
        "500":
          $ref: "#/components/responses/Error500"

  /v1/brains/{brainId}/graph:
    parameters:
      - $ref: "#/components/parameters/BrainId"
    get:
      operationId: getGraph
      tags:
        - Search
