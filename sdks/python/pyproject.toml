[project]
name = "memtavi"
version = "0.1.0"
description = "Memtavi API client"
readme = "src/memtavi/README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=1.9.2",
    "typing_extensions>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memtavi"]
