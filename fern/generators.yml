api:
  specs:
    - openapi: ../packages/spec/openapi.yaml

default-group: typescript-sdk

groups:
  typescript-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.0.0
        output:
          location: local-file-system
          path: ../packages/spec/generated/typescript-sdk
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.0.0
        output:
          location: local-file-system
          path: ../packages/spec/generated/python-sdk
  cli:
    generators:
      - name: fernapi/fern-cli
        version: 0.9.0
        output:
          location: local-file-system
          path: ../packages/spec/generated/cli
  mcp:
    generators:
      - name: fernapi/fern-mcp-server
        version: 0.5.0
        output:
          location: local-file-system
          path: ../packages/spec/generated/mcp
