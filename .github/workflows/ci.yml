name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Spec lint
        run: bun run spec:lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://memtavi:memtavi@localhost:5432/memtavi_dev
      APP_DATABASE_URL: postgres://memtavi_app:memtavi_app@localhost:5432/memtavi_dev
      TEST_DATABASE_URL: postgres://memtavi:memtavi@localhost:5432/memtavi_test
      TEST_APP_DATABASE_URL: postgres://memtavi_app:memtavi_app@localhost:5432/memtavi_test
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: memtavi
          POSTGRES_PASSWORD: memtavi
          POSTGRES_DB: memtavi_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memtavi -d memtavi_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Bootstrap roles, databases and extensions
        env:
          PGPASSWORD: memtavi
        run: |
          psql -h localhost -p 5432 -U memtavi -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'memtavi_app') THEN
              CREATE ROLE memtavi_app LOGIN PASSWORD 'memtavi_app' NOSUPERUSER NOBYPASSRLS;
            END IF;
          END
          $$;
          SELECT 'CREATE DATABASE memtavi_dev OWNER memtavi'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'memtavi_dev')
          \gexec
          SELECT 'CREATE DATABASE memtavi_test OWNER memtavi'
          WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = 'memtavi_test')
          \gexec
          GRANT CONNECT ON DATABASE memtavi_dev TO memtavi_app;
          GRANT CONNECT ON DATABASE memtavi_test TO memtavi_app;
          SQL
          for database in memtavi_dev memtavi_test; do
            psql -h localhost -p 5432 -U memtavi -d "$database" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          CREATE EXTENSION IF NOT EXISTS unaccent;
          CREATE EXTENSION IF NOT EXISTS citext;
          SQL
          done
      - name: Migrate memtavi_dev
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://memtavi:memtavi@localhost:5432/memtavi_dev
      - name: Migrate memtavi_test
        run: bun run --cwd packages/db db:migrate
        env:
          DATABASE_URL: postgres://memtavi:memtavi@localhost:5432/memtavi_test
      - name: Unit tests
        run: bun run test:unit
      - name: Isolation tests
        run: bun run test:isolation
      - name: Integration tests
        run: bun run test:integration
